# Ganchos locais: chamam o ruff travado em backend/uv.lock, então o commit e o comando manual
# usam sempre a mesma versão e as mesmas regras (backend/pyproject.toml).
# Instalação, uma vez por cópia do repositório, na raiz: uv run --project backend pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        files: ^backend/
