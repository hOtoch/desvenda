[project]
name = "desvenda-backend"
version = "0.1.0"
description = "Backend do Desvenda"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--allow-hosts=127.0.0.1,::1,localhost --cov --cov-report=term-missing --strict-markers"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
